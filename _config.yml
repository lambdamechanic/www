title: LambdaMechanic
description: LambdaMechanic offers senior software consulting for hard technical problems, LLM systems, and backend architecture.
url: https://lambdamechanic.com

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
  - .gitignore
plugins:
  - jekyll-feed
permalink: /blog/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
