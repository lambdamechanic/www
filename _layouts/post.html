---
layout: default
---

<article class="post">
  <header class="post-header container">
    <p class="eyebrow">LambdaMechanic Blog</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      <span aria-hidden="true">·</span>
      <span>{{ page.author | default: "LambdaMechanic" }}</span>
    </p>
    {% if page.description %}
      <p class="post-description">{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="post-content container">
    {{ content }}
  </div>
  <footer class="post-footer container">
    <a class="post-back-link" href="{{ '/blog/' | relative_url }}">← Back to all posts</a>
  </footer>
</article>
