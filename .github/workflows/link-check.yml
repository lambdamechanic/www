name: Link Check

on:
  pull_request:
  push:
    branches:
      - gh-pages

jobs:
  check-links:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run link check
        run: bundle exec rake check_links
